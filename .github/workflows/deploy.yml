name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: health-insights/package-lock.json

      - name: Install dependencies
        working-directory: health-insights
        run: npm ci

      - name: Build
        working-directory: health-insights
        run: npm run build
        env:
          VITE_BASE_URL: /jaynaga/

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: health-insights/dist
